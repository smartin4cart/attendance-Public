<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>출퇴근 체크</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
    .screen{width:100%;max-width:420px;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
    /* 상단바 */
    .topbar{padding:20px 20px 16px;text-align:center;flex-shrink:0;}
    .topbar.blue{background:#1a3a5c;}
    .topbar.green{background:#0f6e56;}
    .topbar.amber{background:#2d4a1e;}
    .topbar .co{font-size:11px;color:rgba(255,255,255,0.55);letter-spacing:0.12em;margin-bottom:3px;}
    .topbar .ti{font-size:17px;font-weight:600;color:#fff;}
    /* 바디 */
    .body{padding:20px 20px 32px;flex:1;}
    .intro{font-size:14px;color:#666;line-height:1.7;margin-bottom:20px;}
    /* 단계표시 */
    .sw{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;}
    .sd{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
    .sd.active{background:#1a3a5c;color:#fff;}
    .sd.done{background:#0f6e56;color:#fff;}
    .sd.off{background:#e0e3e8;color:#aaa;}
    .sl{width:28px;height:2px;border-radius:1px;background:#e0e3e8;}
    .sl.done{background:#0f6e56;}
    .slabel{font-size:11px;color:#888;text-align:center;margin-bottom:20px;}
    /* 입력 */
    .fl{font-size:12px;color:#888;letter-spacing:0.06em;margin-bottom:6px;}
    .fi{width:100%;background:#f7f8fa;border:1px solid #e0e3e8;border-radius:10px;padding:12px 14px;font-size:15px;color:#1a1a1a;margin-bottom:14px;outline:none;transition:border-color 0.15s;}
    .fi:focus{border-color:#1a3a5c;background:#fff;}
    .fhint{font-size:11px;color:#aaa;margin-top:-10px;margin-bottom:14px;padding-left:4px;}
    /* 버튼 */
    .bp{width:100%;background:#1a3a5c;color:#fff;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity 0.15s;}
    .bp:active{opacity:0.85;}
    .bp:disabled{opacity:0.4;cursor:not-allowed;}
    .bp.amber{background:#2d4a1e;}
    .bp.gray{background:#888;}
    .brow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
    .bin{background:#1a3a5c;color:#fff;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
    .bin:active{opacity:0.85;}
    .bout{background:#fff;color:#1a3a5c;border:2px solid #1a3a5c;border-radius:12px;padding:16px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
    .bout:active{opacity:0.7;}
    /* 위치배지 */
    .lb{background:#e8f1fb;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:16px;}
    .ld{width:9px;height:9px;border-radius:50%;background:#185fa5;flex-shrink:0;}
    .lt{font-size:13px;color:#0c447c;font-weight:500;}
    /* 시간 */
    .tb{text-align:center;margin-bottom:16px;}
    .tbig{font-size:38px;font-weight:300;color:#1a1a1a;letter-spacing:-0.02em;}
    .tsub{font-size:13px;color:#888;margin-top:3px;}
    .div{height:1px;background:#f0f2f5;margin:0 0 16px;}
    /* 유저칩 */
    .uc{display:flex;align-items:center;gap:12px;background:#f7f8fa;border-radius:12px;padding:12px 14px;margin-bottom:6px;}
    .av{width:40px;height:40px;border-radius:50%;background:#dbeafa;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#1a3a5c;flex-shrink:0;}
    .un{font-size:15px;font-weight:600;color:#1a1a1a;}
    .ui{font-size:12px;color:#888;margin-top:1px;}
    .ud{font-size:11px;color:#0f6e56;margin-top:1px;font-weight:500;}
    .rb{font-size:12px;color:#aaa;background:none;border:none;cursor:pointer;text-decoration:underline;display:block;text-align:right;margin-bottom:14px;padding:4px 0;}
    /* 메시지 */
    .err{font-size:13px;color:#c0392b;margin-top:-8px;margin-bottom:12px;padding-left:4px;}
    .ebox{background:#fff0f0;border:1px solid #f5c6c6;border-radius:10px;padding:12px 14px;margin-bottom:14px;text-align:center;}
    .ebox .et{font-size:14px;font-weight:600;color:#c0392b;margin-bottom:4px;}
    .ebox .ed{font-size:12px;color:#888;}
    /* 인증배지 */
    .vbadge{display:inline-flex;align-items:center;gap:5px;background:#e1f5ee;border-radius:20px;padding:4px 10px;font-size:11px;color:#0f6e56;font-weight:600;margin-bottom:14px;}
    .vdot{width:6px;height:6px;border-radius:50%;background:#0f6e56;}
    /* 판정 배지 */
    .judge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;margin-bottom:4px;}
    .judge.ok{background:#e1f5ee;color:#0f6e56;}
    .judge.late{background:#fff0f0;color:#c0392b;}
    .judge.early{background:#fff8e1;color:#e65100;}
    .judge.ot{background:#e8f1fb;color:#1a3a5c;}
    /* 연장 안내박스 */
    .otbox{background:#e8f1fb;border:1px solid #b5d4f4;border-radius:12px;padding:16px;margin-bottom:14px;}
    .otbox .ott{font-size:14px;font-weight:600;color:#1a3a5c;margin-bottom:6px;}
    .otbox .otd{font-size:13px;color:#555;margin-bottom:12px;line-height:1.6;}
    /* 완료화면 */
    .sbody{padding:32px 20px;text-align:center;}
    .cc{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
    .cc.ok{background:#e1f5ee;}
    .cc.late{background:#fff0f0;}
    .cc.early{background:#fff8e1;}
    .cc.ot{background:#e8f1fb;}
    .sname{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:5px;}
    .smsg{font-size:14px;color:#666;margin-bottom:20px;}
    .rbox{background:#f7f8fa;border-radius:12px;padding:14px 16px;text-align:left;}
    .rr{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:0.5px solid #f0f2f5;}
    .rr:last-child{border-bottom:none;}
    .rk{color:#888;}
    .rv{color:#1a1a1a;font-weight:500;}
    .rv-ok{color:#0f6e56;font-weight:500;}
    .rv-late{color:#c0392b;font-weight:500;}
    .rv-early{color:#e65100;font-weight:500;}
    .rv-ot{color:#1a3a5c;font-weight:500;}
    .bc{width:100%;color:#fff;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;transition:opacity 0.15s;}
    .bc:active{opacity:0.85;}
    .bc.ok{background:#0f6e56;}
    .bc.late{background:#c0392b;}
    .bc.early{background:#e65100;}
    .bc.ot{background:#1a3a5c;}
    /* 로딩 */
    .loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;color:#888;font-size:14px;}
    .spinner{width:18px;height:18px;border:2px solid #e0e3e8;border-top-color:#1a3a5c;border-radius:50%;animation:spin 0.7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .hint{font-size:11px;color:#bbb;text-align:center;margin-top:24px;line-height:1.6;}
  </style>
</head>
<body>
<div class="screen" id="screen"></div>
<script>
/* ===== 설정값 ===== */
const COMPANY_NAME = '스마트인포 주식회사';
const GAS_URL = 'https://script.google.com/macros/s/여기에_URL_입력/exec';
const OT_THRESHOLD_MIN = 60; // 퇴근기준 + 몇 분 초과 시 연장코드 질문 (60분)
const LOCATION_MAP = {
  'A1':'탈의실 A동 1호','A2':'탈의실 A동 2호',
  'B1':'탈의실 B동 1호','B2':'탈의실 B동 2호',
};
/* ================= */

const locKey   = new URLSearchParams(window.location.search).get('loc')||'A1';
const LOCATION = LOCATION_MAP[locKey]||locKey;

const getTime = ()=>{const n=new Date();return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');};
const getDate = ()=>{const n=new Date(),d=['일','월','화','수','목','금','토'];return n.getFullYear()+'년 '+(n.getMonth()+1)+'월 '+n.getDate()+'일 '+d[n.getDay()]+'요일';};
const getInitials = n=>(n||'?').trim().slice(0,2);
const getNowMin  = ()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};

/* 판정 계산 */
function calcJudge(type, stdTime, nowMin, isOT) {
  // stdTime: "09:00" 형식
  const [h,m] = stdTime.split(':').map(Number);
  const stdMin = h*60+m;
  if (type==='출근') {
    return nowMin <= stdMin ? 'ok' : 'late';
  } else {
    if (nowMin < stdMin) return 'early';
    if (isOT) return 'ot';
    return 'ok';
  }
}
const judgeLabel = {ok:'✅ 정상', late:'⚠️ 지각', early:'⚠️ 조기퇴근', ot:'🕐 연장근무'};
const judgeClass = {ok:'ok', late:'late', early:'early', ot:'ot'};

/* 단계표시 */
function steps(cur, total=3) {
  let html='<div class="sw">';
  for(let i=1;i<=total;i++){
    const cls = i<cur?'done':i===cur?'active':'off';
    html+=`<div class="sd ${cls}">${i<cur?'✓':i}</div>`;
    if(i<total) html+=`<div class="sl ${cur>i?'done':''}"></div>`;
  }
  html+='</div>';
  const labels=['','사번 입력','직원 인증','출퇴근 체크'];
  html+=`<div class="slabel">${labels[Math.min(cur,3)]}</div>`;
  return html;
}

/* ── 화면1: 사번입력 ── */
function showStep1() {
  document.getElementById('screen').innerHTML=`
    <div class="topbar blue"><div class="co">${COMPANY_NAME}</div><div class="ti">직원 등록</div></div>
    <div class="body">
      ${steps(1)}
      <p class="intro">처음 사용하시는군요!<br>사번을 입력해 주세요.</p>
      <div class="fl">사번</div>
      <input class="fi" id="inp-id" placeholder="예: EMP-0142" autocomplete="off"/>
      <div id="err-id"></div>
      <button class="bp" onclick="doStep1()">다음 — 직원 인증</button>
      <div class="hint">홈 화면에 추가하면 앱처럼 사용할 수 있어요</div>
    </div>`;
  const el=document.getElementById('inp-id');
  el.addEventListener('keydown',e=>{if(e.key==='Enter')doStep1();});
  el.focus();
}
function doStep1(){
  const id=document.getElementById('inp-id').value.trim().toUpperCase();
  document.getElementById('err-id').innerHTML='';
  if(!id){document.getElementById('err-id').innerHTML='<div class="err">사번을 입력해 주세요.</div>';return;}
  sessionStorage.setItem('temp_id',id);
  showStep2(id);
}

/* ── 화면2: 생년월일 검증 ── */
function showStep2(empId, errMsg=''){
  document.getElementById('screen').innerHTML=`
    <div class="topbar amber"><div class="co">${COMPANY_NAME}</div><div class="ti">직원 인증</div></div>
    <div class="body">
      ${steps(2)}
      <p class="intro">사번: <strong>${empId}</strong><br>본인 확인을 위해 생년월일을 입력해 주세요.</p>
      <div class="fl">생년월일 (8자리)</div>
      <input class="fi" id="inp-birth" placeholder="예: 19901225" maxlength="8" inputmode="numeric" autocomplete="off"/>
      <div class="fhint">YYYYMMDD 형식 · 예) 1990년 12월 25일 → 19901225</div>
      ${errMsg?`<div class="ebox"><div class="et">인증 실패</div><div class="ed">${errMsg}</div></div>`:''}
      <div id="vstatus"></div>
      <button class="bp amber" id="btn-v" onclick="doStep2('${empId}')">인증하기</button>
      <button class="rb" onclick="showStep1()">사번 다시 입력</button>
    </div>`;
  const el=document.getElementById('inp-birth');
  el.addEventListener('keydown',e=>{if(e.key==='Enter')doStep2(empId);});
  el.focus();
}
async function doStep2(empId){
  const birth=document.getElementById('inp-birth').value.trim();
  if(!/^\d{8}$/.test(birth)){
    document.getElementById('vstatus').innerHTML='<div class="err">8자리 숫자로 입력해 주세요. (예: 19901225)</div>';
    return;
  }
  document.getElementById('btn-v').disabled=true;
  document.getElementById('vstatus').innerHTML='<div class="loading"><div class="spinner"></div>인증 중...</div>';
  try{
    const res=await fetch(`${GAS_URL}?action=verify&emp_id=${encodeURIComponent(empId)}&birth=${birth}`);
    const data=await res.json();
    if(data.success){
      localStorage.setItem('emp_id',empId);
      localStorage.setItem('emp_name',data.name);
      localStorage.setItem('emp_dept',data.dept||'');
      localStorage.setItem('emp_std',data.std_time||'09:00'); // 출근기준시간
      sessionStorage.removeItem('temp_id');
      showCheckin(empId,data.name,data.dept||'',data.std_time||'09:00');
    } else {
      showStep2(empId,data.message||'등록된 직원 정보와 일치하지 않습니다.');
    }
  } catch(e){
    if(GAS_URL.includes('여기에_URL_입력')){
      // 테스트 모드: EMP-TEST / 19900101
      if(empId==='EMP-TEST'&&birth==='19900101'){
        localStorage.setItem('emp_id','EMP-TEST');
        localStorage.setItem('emp_name','테스트직원');
        localStorage.setItem('emp_dept','관리팀');
        localStorage.setItem('emp_std','09:00');
        showCheckin('EMP-TEST','테스트직원','관리팀','09:00');
      } else {
        showStep2(empId,'[테스트 모드] 사번: EMP-TEST / 생년월일: 19900101 으로 테스트하세요.');
      }
      return;
    }
    document.getElementById('vstatus').innerHTML='<div class="err">서버 오류. 잠시 후 다시 시도해 주세요.</div>';
    document.getElementById('btn-v').disabled=false;
  }
}

/* ── 화면3: 출퇴근 체크 ── */
let clk=null;
function showCheckin(empId,empName,empDept,stdTime){
  if(clk)clearInterval(clk);
  document.getElementById('screen').innerHTML=`
    <div class="topbar blue"><div class="co">${COMPANY_NAME}</div><div class="ti">출퇴근 체크</div></div>
    <div class="body">
      <div class="lb"><div class="ld"></div><div class="lt">${LOCATION} · QR 인식됨</div></div>
      <div class="tb">
        <div class="tbig" id="lt">${getTime()}</div>
        <div class="tsub">${getDate()}</div>
      </div>
      <div class="div"></div>
      <div class="vbadge"><div class="vdot"></div>직원 인증 완료</div>
      <div class="uc">
        <div class="av">${getInitials(empName)}</div>
        <div>
          <div class="un">${empName}</div>
          <div class="ui">${empId}</div>
          ${empDept?`<div class="ud">${empDept}</div>`:''}
          <div class="ud" style="color:#888;">기준 ${stdTime} 출근</div>
        </div>
      </div>
      <button class="rb" onclick="doReset()">내가 아닌가요? 재등록</button>
      <div class="brow">
        <button class="bin" onclick="doCheckin('출근','${empId}','${empName}','${empDept}','${stdTime}')">출근</button>
        <button class="bout" onclick="doCheckin('퇴근','${empId}','${empName}','${empDept}','${stdTime}')">퇴근</button>
      </div>
      <div class="hint">홈 화면에 추가하면 앱처럼 사용할 수 있어요</div>
    </div>`;
  clk=setInterval(()=>{const e=document.getElementById('lt');if(e)e.textContent=getTime();else clearInterval(clk);},15000);
}

/* ── 출퇴근 처리 분기 ── */
function doCheckin(type,empId,empName,empDept,stdTime){
  const nowMin=getNowMin();
  const [h,m]=stdTime.split(':').map(Number);
  const stdMin=h*60+m;

  if(type==='퇴근'){
    // 퇴근 기준시간 + 1시간 초과 시 연장코드 화면
    if(nowMin > stdMin+OT_THRESHOLD_MIN){
      showOTCode(empId,empName,empDept,stdTime,nowMin);
      return;
    }
  }
  // 바로 판정 후 완료
  const judge=calcJudge(type,stdTime,nowMin,false);
  doRecord(type,empId,empName,empDept,stdTime,judge,null);
}

/* ── 연장근무 코드 입력 화면 ── */
function showOTCode(empId,empName,empDept,stdTime,nowMin){
  if(clk)clearInterval(clk);
  const [h,m]=stdTime.split(':').map(Number);
  const stdMin=h*60+m;
  const overMin=nowMin-stdMin;
  const overH=Math.floor(overMin/60),overM=overMin%60;
  const overText=overH>0?`${overH}시간 ${overM}분`:`${overM}분`;

  document.getElementById('screen').innerHTML=`
    <div class="topbar blue"><div class="co">${COMPANY_NAME}</div><div class="ti">퇴근 체크</div></div>
    <div class="body">
      <div class="lb"><div class="ld"></div><div class="lt">${LOCATION} · QR 인식됨</div></div>
      <div class="tb">
        <div class="tbig">${getTime()}</div>
        <div class="tsub">${getDate()}</div>
      </div>
      <div class="div"></div>
      <div class="otbox">
        <div class="ott">🕐 퇴근 기준보다 ${overText} 경과</div>
        <div class="otd">연장근무 승인을 받으셨나요?<br>승인코드가 있으면 입력해 주세요.<br>없으면 <strong>코드 없이 퇴근</strong>을 눌러 주세요.</div>
        <div class="fl">연장근무 승인코드 (4자리)</div>
        <input class="fi" id="inp-ot" placeholder="예: 7842" maxlength="4" inputmode="numeric" autocomplete="off"/>
        <div id="ot-err"></div>
      </div>
      <button class="bp" onclick="doOTCode('${empId}','${empName}','${empDept}','${stdTime}')">승인코드로 연장근무 처리</button>
      <button class="bp gray" style="margin-top:8px;" onclick="doRecordDirect('퇴근','${empId}','${empName}','${empDept}','${stdTime}','ok')">코드 없이 정상 퇴근</button>
      <button class="rb" onclick="showCheckin('${empId}','${empName}','${empDept}','${stdTime}')">뒤로</button>
    </div>`;
  document.getElementById('inp-ot').addEventListener('keydown',e=>{
    if(e.key==='Enter') doOTCode(empId,empName,empDept,stdTime);
  });
}

async function doOTCode(empId,empName,empDept,stdTime){
  const code=document.getElementById('inp-ot').value.trim();
  if(!/^\d{4}$/.test(code)){
    document.getElementById('ot-err').innerHTML='<div class="err">4자리 숫자를 입력해 주세요.</div>';
    return;
  }
  document.getElementById('ot-err').innerHTML='<div class="loading"><div class="spinner"></div>코드 확인 중...</div>';

  try{
    const res=await fetch(`${GAS_URL}?action=verify_ot&emp_id=${encodeURIComponent(empId)}&code=${code}`);
    const data=await res.json();
    const judge = data.valid ? 'ot' : 'ok';
    const note  = data.valid ? null : '승인코드 불일치 — 정상퇴근으로 처리됨';
    doRecord('퇴근',empId,empName,empDept,stdTime,judge,note);
  } catch(e){
    if(GAS_URL.includes('여기에_URL_입력')){
      // 테스트: 코드 1234 → 연장근무
      const judge = code==='1234' ? 'ot' : 'ok';
      doRecord('퇴근',empId,empName,empDept,stdTime,judge,null);
      return;
    }
    document.getElementById('ot-err').innerHTML='<div class="err">서버 오류. 잠시 후 다시 시도해 주세요.</div>';
  }
}

function doRecordDirect(type,empId,empName,empDept,stdTime,judge){
  doRecord(type,empId,empName,empDept,stdTime,judge,null);
}

/* ── 기록 전송 ── */
async function doRecord(type,empId,empName,empDept,stdTime,judge,note){
  const t=getTime();
  const nowMin=getNowMin();
  const [h,m]=stdTime.split(':').map(Number);
  const stdMin=h*60+m;
  const diffMin=nowMin-stdMin;
  const diffText=Math.abs(diffMin)+'분 '+(diffMin>=0?'후':'전');

  try{
    await fetch(GAS_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        action:'record',
        timestamp:new Date().toISOString(),
        emp_id:empId, emp_name:empName, emp_dept:empDept,
        location:LOCATION, type, judge,
        std_time:stdTime, diff_text:diffText,
        note:note||''
      }),
      mode:'no-cors'
    });
  } catch(e){}

  showDone(type,empId,empName,empDept,stdTime,judge,t,diffText,note);
}

/* ── 화면4: 완료 ── */
function showDone(type,empId,empName,empDept,stdTime,judge,t,diffText,note){
  if(clk)clearInterval(clk);
  const jc=judgeClass[judge];
  const jl=judgeLabel[judge];

  // 아이콘 색상
  const iconColor={ok:'#0f6e56',late:'#c0392b',early:'#e65100',ot:'#1a3a5c'}[judge];
  const iconPath = judge==='late'||judge==='early'
    ? 'M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z'
    : judge==='ot'
    ? 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z'
    : 'M5 13l4 4L19 7';

  const topColor={ok:'green',late:'blue',early:'blue',ot:'blue'}[judge];

  document.getElementById('screen').innerHTML=`
    <div class="topbar ${topColor}"><div class="co">${COMPANY_NAME}</div><div class="ti">출퇴근 체크</div></div>
    <div class="sbody">
      <div class="cc ${jc}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="${iconPath}" stroke="${iconColor}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="sname">${empName} 님</div>
      <div class="smsg">${type}이 기록되었습니다</div>
      <div class="judge ${jc}">${jl}</div>
      ${note?`<div style="font-size:11px;color:#e65100;margin-bottom:12px;">${note}</div>`:''}
      <div class="rbox" style="margin-top:12px;">
        <div class="rr"><span class="rk">구분</span><span class="rv">${type}</span></div>
        <div class="rr"><span class="rk">시각</span><span class="rv">${t}</span></div>
        <div class="rr"><span class="rk">기준</span><span class="rv">${stdTime} ${type==='출근'?'출근':'퇴근'}</span></div>
        <div class="rr"><span class="rk">판정</span><span class="rv-${jc}">${jl}</span></div>
        <div class="rr"><span class="rk">차이</span><span class="rv">${diffText}</span></div>
        <div class="rr"><span class="rk">위치</span><span class="rv">${LOCATION}</span></div>
        ${empDept?`<div class="rr"><span class="rk">부서</span><span class="rv">${empDept}</span></div>`:''}
        <div class="rr"><span class="rk">저장</span><span class="rv-ok">Google Sheets 완료</span></div>
      </div>
      <button class="bc ${jc}" onclick="showCheckin('${empId}','${empName}','${empDept}','${stdTime}')">확인</button>
    </div>`;
}

/* ── 재등록 ── */
function doReset(){
  if(confirm('저장된 정보를 삭제하고 재등록할까요?')){
    localStorage.clear();sessionStorage.clear();showStep1();
  }
}

/* ── 시작 ── */
const sid=localStorage.getItem('emp_id'),sname=localStorage.getItem('emp_name');
const sdept=localStorage.getItem('emp_dept')||'',sstd=localStorage.getItem('emp_std')||'09:00';
if(sid&&sname) showCheckin(sid,sname,sdept,sstd);
else showStep1();
</script>
